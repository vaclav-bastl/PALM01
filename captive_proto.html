<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>PALM Configurator – Tap Test</title>
<style>
  :root { --bg:#0b0d10; --fg:#eaeef2; --muted:#9aa4af; --card:#14181d; --stroke:#2a2f36; --hi:#47c1ff; --accent:#ee2a7b; }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 16px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
  @media(max-width:900px){ .layout{grid-template-columns:1fr} }
  .card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 #0008}
  .controllerCard{display:flex;justify-content:center;align-items:flex-start}
  /* HARD SIZE CLAMP: both CSS and attribute on the SVG */
  .controllerCard svg{width:180px;max-width:180px;height:auto;display:block;touch-action:manipulation}
  label{font-size:12px;color:var(--muted)}
  select,input{width:100%;padding:10px;border-radius:12px;border:1px solid var(--stroke);background:#0f1318;color:var(--fg)}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hr{height:1px;background:var(--stroke);margin:12px 0}
  .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#0f1318;border:1px solid var(--stroke);color:var(--muted);font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre;background:#0f1318;border:1px solid var(--stroke);border-radius:12px;padding:10px;overflow:auto}
  /* Interactivity */
  .pad{cursor:pointer;pointer-events:auto;transition:filter .12s ease}
  .pad:hover{filter:brightness(1.08)}
  .pad.selected{ fill:var(--hi) !important; stroke:var(--hi); stroke-width:1.5 }
  .thumb{cursor:pointer;pointer-events:auto;transition:filter .12s ease}
  .thumb:hover{filter:brightness(1.08)}
  .thumb.active{ fill:var(--accent) !important }
</style>
</head>
<body>
<div class="wrap">
  <h1>PALM Configurator <span id="status" class="pill">ready</span></h1>

  <div class="layout">

        <g id="n"><rect class="z" x="3.97" y="273.69" width="20.34" height="20.34"/><circle class="aa" cx="14.34" cy="283.99" r="5.71"/><rect class="z" x="47.66" y="273.69" width="20.34" height="20.34"/><circle class="aa" cx="58.03" cy="283.99" r="5.71"/><rect class="ag" x="26.57" y="300.63" width="18.34" height="17.72"/><circle class="af" cx="35.75" cy="309.49" r="7.13"/><circle class="ab" cx="35.98" cy="283.99" r="8.91"/></g>

        <!-- INTERACTIVE GROUP: add IDs to these shapes -->

          <!-- Thumbs (add ids + class) -->

          <!-- Pads (add ids + class="pad") -->

          <polygon id="INDEX_A" class="ac pad" points="25.73 56.27 14.08 56.27 5.85 64.51 5.85 76.15 14.08 84.38 25.73 84.38 33.96 76.15 33.96 64.51 25.73 56.27"/>
          <polygon id="INDEX_B" class="z pad" points="57.35 56.27 45.7 56.27 37.47 64.51 37.47 76.15 45.7 84.38 57.35 84.38 65.58 76.15 65.58 64.51 57.35 56.27"/>

    </div>

    <!-- RIGHT: minimal controls (as you wanted: dropdowns only where triangle) -->
    <div class="card">
      <div class="row3">
        <div><label>I AM USING THIS EXO PALM IN:</label>
          <select id="hand"><option value="LEFT">LEFT HAND</option><option value="RIGHT">RIGHT HAND</option></select>
        </div>
        <div><label>PRESET</label>
          <select id="preset">
            <option value="0">PRESET 0</option>
            <option value="1">PRESET 1</option>
            <option value="2">PRESET 2</option>
            <option value="3">PRESET 3</option>
          </select>
        </div>
        <div><label>CH</label>
          <select id="channel"></select>
        </div>
      </div>

      <div class="row3" style="margin-top:8px">
        <div><label>MODE</label><select id="mode"><option value="0">CC MODE</option><option value="1">NOTE MODE</option></select></div>
        <div><label>SELECTOR CC (pinky-held)</label><input id="selcc" type="number" inputmode="numeric" min="0" max="127" value="102"></div>
        <div></div>
      </div>

      <div class="hr"></div>
      <div style="font-weight:700;margin-bottom:6px">TOUCH EDITOR <span id="touchBadge" class="pill">Tap a pad →</span></div>
      <div class="row2">
        <div><label>TARGET (finger)</label><input id="fingerName" disabled></div>
        <div><label>RANGE</label>
          <select id="rng"><option value="255">ON/OFF</option><option value="127">CONTINUOUS</option><option value="0">DISABLED</option></select>
        </div>
        <div><label>TOUCH CC</label><input id="tch" type="number" inputmode="numeric" min="0" max="127" value="19"></div>
        <div><label>WRIST CC</label><input id="wr" type="number" inputmode="numeric" min="0" max="127" value="20"></div>
        <div><label>ON RELEASE</label><select id="wrst"><option value="0">RESET TO 0</option><option value="64">RESET TO 64</option><option value="127" selected>RESET TO 127</option></select></div>
        <div><label>ELBOW CC</label><input id="elb" type="number" inputmode="numeric" min="0" max="127" value="21"></div>
        <div><label>ON RELEASE</label><select id="elrst"><option value="0">RESET TO 0</option><option value="64" selected>RESET TO 64</option><option value="127">RESET TO 127</option></select></div>
      </div>

      <div class="hr"></div>
      <div class="mono" id="debug">—</div>
    </div>
  </div>
</div>

<script>
  // Fill channel dropdown 1..16
  (function(){ const ch = document.getElementById('channel'); for(let i=1;i<=16;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i; ch.appendChild(o);} ch.value=1; })();

  const debug = (msg)=>document.getElementById('debug').textContent = String(msg);

  // Helper: bind both touch and click
  function bindTap(el, fn){
    ['pointerdown','touchstart','click'].forEach(ev=>
      el.addEventListener(ev, e=>{ e.preventDefault(); fn(e); }, {passive:false})
    );
  }

  // Wire pads
  const padIds = ['INDEX_A','INDEX_B','MIDDLE_A','MIDDLE_B','RING_A','RING_B','LITTLE_A','LITTLE_B'];
  padIds.forEach(id=>{
    const el = document.getElementById(id);
    if(!el){ console.warn('Missing pad', id); return; }
    el.classList.add('pad');
    bindTap(el, ()=>{
      // Visual select
      document.querySelectorAll('.pad').forEach(p=>p.classList.remove('selected'));
      el.classList.add('selected');
      // Editor header
      document.getElementById('fingerName').value = id.replace('_',' ');
      document.getElementById('touchBadge').textContent = id.replace('_',' ');
      debug('Pad: '+id+' tapped');
    });
  });

  // Wire thumbs (preset)
  const thumbs = [
    ['THUMB_L', 1],
    ['THUMB_M', 2],
    ['THUMB_R', 3],
  ];
  function setThumbActive(preset){
    document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
    if(preset>=1 && preset<=3){
      const id = ['THUMB_L','THUMB_M','THUMB_R'][preset-1];
      const el = document.getElementById(id);
      if(el) el.classList.add('active');
    }
  }
  thumbs.forEach(([id,p])=>{
    const el = document.getElementById(id);
    if(!el){ console.warn('Missing thumb', id); return; }
    el.classList.add('thumb');
    bindTap(el, ()=>{
      document.getElementById('preset').value = String(p);
      setThumbActive(p);
      debug('Preset via thumb: '+p);
    });
  });

  // Dropdown preset also controls thumb highlight (0 = none)
  document.getElementById('preset').addEventListener('change', (e)=>{
    const p = Number(e.target.value)||0;
    setThumbActive(p);
    debug('Preset via dropdown: '+p);
  });

  // Initial state: preset 0 (no thumb lit)
  setThumbActive(0);
  debug('Ready. Tap a pad or a top hex.');
</script>
</body>
</html>
